<meta name="theme-color" content="#007E7A">
<style>
:root{
  --p:#007E7A;--p2:#00a19c;--p3:#005b58;--pl:#e8f5f4;--pl2:#d0ecea;--pr:rgba(0,126,122,.14);
  --bg:#f4f7f7;--card:#ffffff;--tx:#14302e;--tx2:#3d5654;--mu:#7a8c8b;--bd:#e3ebea;--bd2:#cfdcdb;
  --hd:#f3f9f8;--hov:#f7fbfb;--sel:#edf8f7;--dng:#e5484d;--dngl:#fdecec;--ok:#12a594;--warn:#FFC000;
  --sh1:0 1px 2px rgba(16,40,38,.05);--sh2:0 2px 6px rgba(16,40,38,.05),0 10px 28px rgba(16,40,38,.07);
  --sh3:0 18px 50px rgba(10,30,28,.22);--r:16px;--r2:11px
}
@media (prefers-color-scheme:dark){
  :root{--pl:#122d2b;--pl2:#18403d;--pr:rgba(0,190,180,.18);--bg:#0b1312;--card:#121c1b;--tx:#e6efee;--tx2:#b8c9c7;--mu:#869998;
  --bd:#213130;--bd2:#2d4442;--hd:#152422;--hov:#152120;--sel:#173230;--dngl:#3a1a1b;--sh3:0 18px 50px rgba(0,0,0,.6)}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex-shrink:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100vh;padding:16px;gap:12px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:transparent;display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 14px rgba(0,126,122,.28);overflow:hidden}
.logo img{width:100%;height:100%;display:block;object-fit:contain}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
.brand p{margin:1px 0 0;color:var(--mu);font-size:12.5px}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);padding:7px 12px;border-radius:999px;font-size:12.5px;color:var(--tx2);box-shadow:var(--sh1)}
.stat b{color:var(--tx)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu);display:inline-block;flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(18,165,148,.18)}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
.dot.err{background:var(--dng);box-shadow:0 0 0 4px rgba(229,72,77,.18)}
@keyframes pulse{50%{opacity:.3}}
.banner{display:none;align-items:center;gap:12px;flex-wrap:wrap;background:#fff8e1;color:#6b4c00;border:1px solid #f4d987;border-radius:var(--r2);padding:11px 14px}
.banner.show{display:flex}
.banner span{flex:1;min-width:200px}
.banner.off{background:#fdecec;color:#8a1f22;border-color:#f3c2c3}
@media (prefers-color-scheme:dark){.banner{background:#2f2710;color:#ffe08a;border-color:#5b4a14}.banner.off{background:#3a1a1b;color:#ffb3b5;border-color:#6b2a2c}}

/* Tabs */
.tabsw{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:5px;box-shadow:var(--sh1)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 200px;min-width:0;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:9px 15px;border-radius:11px;cursor:pointer;white-space:nowrap;color:var(--mu);font-weight:600;font-size:13.5px;transition:color .18s,background .18s}
.tab:hover{color:var(--p);background:var(--pl)}
.tab.on{color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 4px 14px rgba(0,126,122,.32)}
.tab .cnt{font-size:11px;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--bd);color:var(--tx2);font-weight:700}
.tab.on .cnt{background:rgba(255,255,255,.24);color:#fff}
.tab.ghost{font-style:italic}

/* Toolbar */
.bar{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px;box-shadow:var(--sh1)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;border:1px solid var(--bd);background:var(--card);padding:0 14px;border-radius:var(--r2);cursor:pointer;white-space:nowrap;font-weight:600;font-size:13.5px;color:var(--tx2);transition:all .15s}
.btn:hover{border-color:var(--bd2);background:var(--hov);color:var(--tx)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.pri{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,126,122,.28)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.soft{background:var(--pl);border-color:transparent;color:var(--p)}
.btn.soft:hover{background:var(--pl2)}
.btn.dng{background:var(--dng);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(229,72,77,.3)}
.btn.icon{width:38px;padding:0}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.act{border-color:var(--p);color:var(--p);background:var(--pl)}
.sep{width:1px;height:26px;background:var(--bd)}
.sp{flex:1}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#14302e;color:#fff;font-size:11.5px;font-weight:500;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:90;pointer-events:none}
.search{position:relative;flex:0 1 220px;min-width:150px}
.search input{width:100%;height:38px;border:1px solid var(--bd);background:var(--hov);border-radius:var(--r2);padding:0 40px 0 36px;outline:none;transition:.15s}
.search input:focus{background:var(--card);border-color:var(--p);box-shadow:0 0 0 4px var(--pr)}
.search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mu)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10.5px;border:1px solid var(--bd2);border-radius:5px;padding:1px 5px;color:var(--mu);font-family:inherit;background:var(--card)}
.fb{display:none;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--p);color:#fff;font-size:11px;font-weight:700;place-items:center}
.fb.on{display:inline-grid}
.achips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.achip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 11px;border-radius:999px;background:var(--pl);color:var(--p);font-size:12.5px;font-weight:600;border:1px solid var(--pl2);cursor:pointer;max-width:260px}
.achip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.achip small{color:var(--mu);font-weight:600}
.achip .xx{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:inherit;cursor:pointer}
.achip .xx:hover{background:var(--p);color:#fff}
.achip .xx svg{width:12px;height:12px}

.chipsrow:empty{display:none}
.chipsrow{padding:0 4px;margin-top:-4px}
.tab{padding:8px 13px}
@media (max-width:1100px){.bar{flex-wrap:wrap}.tabs{flex:1 1 100%;order:-1}.bar>.sep:first-of-type{display:none}}
/* Grid */
.wrap{flex:1;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2)}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th{position:sticky;top:0;z-index:3;background:var(--hd);color:var(--p3);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.45px;text-align:left;padding:13px 12px;border-bottom:1px solid var(--bd2);vertical-align:bottom;user-select:none}
@media (prefers-color-scheme:dark){th{color:#5fd3cc}}
th .lbl{cursor:pointer;display:flex;align-items:flex-end;gap:6px;line-height:1.35}
th .lbl:hover{color:var(--p)}
th .sub{display:block;font-size:9.5px;font-weight:600;opacity:.75;letter-spacing:.3px;margin-top:2px;text-transform:none}
th .ar{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:5px;font-size:9px;background:var(--p);color:#fff}
th .rz{position:absolute;right:0;top:20%;width:7px;height:60%;cursor:col-resize;border-right:2px solid var(--bd2)}
th .rz:hover{border-color:var(--p)}
th.num,td.num{position:sticky;left:0;width:64px;text-align:center}
td.num{font-variant-numeric:tabular-nums}
td.num .np{color:var(--bd2)}
th.num .lbl{justify-content:center}
th.num{z-index:5}
td.num{z-index:2;background:var(--card);color:var(--mu);font-weight:600;font-size:12px;padding-top:13px;border-right:1px solid var(--bd)}
td.num .pd{display:block;margin:6px auto 0}
td.num .cpi{display:grid;place-items:center;width:24px;height:24px;margin:6px auto 0;border-radius:8px;background:#fff4cc;color:#8a6500;box-shadow:inset 0 0 0 1px #FFC000;cursor:help}
td.num .cpi svg{width:14px;height:14px}
@media (prefers-color-scheme:dark){td.num .cpi{background:#3a300c;color:#ffd75e}}
tbody tr.cpy td.num{box-shadow:inset 3px 0 0 #FFC000}
td{border-bottom:1px solid var(--bd);padding:3px;vertical-align:top;background:var(--card)}
tbody tr:hover td{background:var(--hov)}
tbody tr.sel td{background:var(--sel)}
tbody tr.flash td{animation:fl 1.6s}
@keyframes fl{0%,30%{background:var(--pl2)}}
.ct{width:100%;border:1px solid transparent;background:transparent;padding:8px 9px;outline:none;display:block;border-radius:9px;resize:none;overflow:hidden;min-height:38px;line-height:1.5;white-space:pre-wrap;color:var(--tx)}
.ct::placeholder{color:var(--bd2)}
.ct:hover{border-color:var(--bd)}
.ct:focus{border-color:var(--p);background:var(--card);box-shadow:0 0 0 4px var(--pr)}
td.tx{position:relative}
td.tx.ovf::after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:26px;border-radius:0 0 9px 9px;background:linear-gradient(transparent,var(--card));pointer-events:none}
tbody tr:hover td.tx.ovf::after{background:linear-gradient(transparent,var(--hov))}
tbody tr.sel td.tx.ovf::after{background:linear-gradient(transparent,var(--sel))}
td.tx .mx{position:absolute;right:8px;bottom:7px;z-index:1;display:none;align-items:center;gap:4px;height:22px;padding:0 8px;border:0;border-radius:999px;background:var(--p);color:#fff;font-size:11px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,126,122,.35)}
td.tx .mx svg{width:12px;height:12px}
td.tx.ovf .mx{display:inline-flex}
td.stkc{padding:4px 5px}
.stk{display:flex;flex-direction:column;gap:2px}
.sr{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:4px}
.sr>span{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--mu);text-transform:uppercase;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .cell{min-height:30px;padding:3px 7px}
.sr .cell .tag{padding:2px 8px;font-size:12px}
.cell{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid transparent;background:transparent;padding:6px 8px;cursor:pointer;text-align:left;min-height:38px;border-radius:9px}
.cell:hover{border-color:var(--bd2);background:var(--card)}
.cell:focus-visible{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--pr)}
.cell .cv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cell .ph{color:var(--mu);font-size:13px}
.cell>svg{width:15px;height:15px;color:var(--mu);opacity:0}
.cell:hover>svg,.cell:focus-visible>svg{opacity:1}
.tag{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 10px;border-radius:7px;font-size:12.5px;font-weight:600;background:var(--pl);color:var(--p);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.tag.l{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.dcell{display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;font-weight:600}
.dcell svg{width:15px;height:15px;color:var(--p)}
td.act{text-align:center;white-space:nowrap;padding:8px 4px}
.ib{border:0;background:transparent;cursor:pointer;width:32px;height:32px;border-radius:9px;color:var(--mu);display:inline-grid;place-items:center}
.ib:hover{background:var(--pl);color:var(--p)}
.ib.del:hover{color:var(--dng);background:var(--dngl)}
.ib svg{width:17px;height:17px}
tbody tr td.act .ib{opacity:.45}
tbody tr:hover td.act .ib,tbody tr.sel td.act .ib,td.act .ib:focus-visible{opacity:1}
.empty{text-align:center;color:var(--mu);padding:60px 16px!important;background:var(--card)!important}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--pl);color:var(--p);display:grid;place-items:center;margin:0 auto 14px}
.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
.more td{text-align:center;color:var(--mu);font-size:12px;padding:14px!important;background:var(--card)!important}
.sk{height:14px;border-radius:7px;margin:14px 10px;background:linear-gradient(90deg,var(--bd) 0%,var(--hov) 50%,var(--bd) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--mu);font-size:12px;padding:0 4px}
.foot .sv{display:inline-flex;align-items:center;gap:6px}

/* Popovers */
.pop{position:fixed;z-index:170;display:none;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh3);overflow:hidden}
.pop.show{display:flex;animation:pin .14s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pin{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.cb{width:290px;max-height:400px}
.cb .ps{position:relative;padding:10px;border-bottom:1px solid var(--bd)}
.cb .ps input{width:100%;height:38px;padding:0 10px 0 34px;border:1px solid var(--bd);border-radius:10px;background:var(--hov);outline:none}
.cb .ps input:focus{border-color:var(--p);background:var(--card);box-shadow:0 0 0 4px var(--pr)}
.cb .ps svg{position:absolute;left:21px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mu)}
.cb .mh{display:none;justify-content:space-between;padding:4px 8px;border-bottom:1px solid var(--bd)}
.cb .pl{overflow:auto;padding:6px;flex:1}
.cb .gh{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);padding:8px 10px 4px}
.opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}
.opt .ck{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--bd2);display:grid;place-items:center;flex-shrink:0}
.opt.cur .ck{background:var(--p);border-color:var(--p);color:#fff}
.opt .ck svg{width:12px;height:12px;opacity:0}
.opt.cur .ck svg{opacity:1}
.opt .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt small{color:var(--mu);font-size:11.5px}
.opt:hover,.opt.on{background:var(--pl)}
.opt.on{box-shadow:inset 0 0 0 1px var(--pl2)}
.opt mark{background:rgba(0,161,156,.18);color:inherit;border-radius:3px;padding:0 1px}
.opt.add{color:var(--p);font-weight:600}
.opt.add .ck{border-style:dashed;border-color:var(--p);color:var(--p)}
.opt.add .ck svg{opacity:1}
.opt.clr{color:var(--mu)}
.opt .x{opacity:0;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--mu);border:0;background:transparent;cursor:pointer}
.opt:hover .x,.opt.on .x{opacity:1}
.opt .x:hover{background:var(--dngl);color:var(--dng)}
.opt .x svg{width:15px;height:15px}
.cb .no{padding:22px 12px;color:var(--mu);font-size:12.5px;text-align:center}
.cb .pf{border-top:1px solid var(--bd);padding:7px 12px;font-size:11px;color:var(--mu);display:flex;gap:12px}
.cb .pf kbd{border:1px solid var(--bd2);border-radius:4px;padding:0 4px;font-family:inherit}
.cb .mf{display:none;border-top:1px solid var(--bd);padding:8px 10px;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--tx2)}
.cb.multi .mh,.cb.multi .mf{display:flex}
.cb.multi .pf{display:none}
.dp{width:300px;padding:12px}
.dp .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp .dh b{font-size:14px;text-transform:capitalize}
.dp .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp .wd{font-size:11px;font-weight:700;color:var(--mu);text-align:center;padding:5px 0}
.dp .d{height:36px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.dp .d:hover{background:var(--pl);color:var(--p)}
.dp .d.out{color:var(--bd2)}
.dp .d.td{box-shadow:inset 0 0 0 1.5px var(--p);color:var(--p);font-weight:700}
.dp .d.sl{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700}
.dp .df{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.lnk{border:0;background:transparent;color:var(--p);font-weight:600;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:12.5px}
.lnk:hover{background:var(--pl)}
.lnk.mu{color:var(--mu)}
.hint{position:fixed;z-index:260;pointer-events:none;max-width:320px;background:#14302e;color:#fff;border-radius:9px;padding:7px 11px;font-size:12.5px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s}
.hint.show{opacity:1;transform:none}
.hint small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#7fe0d9;margin-bottom:2px}
.hint b{font-weight:600;word-break:break-word}
.hint i{color:#b8c9c7}
@media (prefers-color-scheme:dark){.hint{background:#e6efee;color:#14302e}.hint small{color:#007E7A}.hint i{color:#5a6e6c}}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,26,25,.46);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:150;padding:16px}
.ov.show{display:flex}
.md{background:var(--card);border-radius:20px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh3);animation:mi .2s cubic-bezier(.2,.9,.3,1.15)}
@keyframes mi{from{opacity:0;transform:translateY(10px) scale(.97)}}
.md header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 14px}
.md header h2{margin:0;font-size:17px;font-weight:700}
.md header p{margin:3px 0 0;color:var(--mu);font-size:13px}
.md .bd{padding:4px 22px 18px;overflow:auto}
.md footer{padding:14px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;background:var(--hov);border-radius:0 0 20px 20px}
.cf{width:min(420px,100%);text-align:center;padding:26px 24px 20px}
.cf .ci{width:58px;height:58px;border-radius:50%;background:var(--dngl);color:var(--dng);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 0 0 8px rgba(229,72,77,.07)}
.cf .ci svg{width:26px;height:26px}
.cf h3{margin:0 0 6px;font-size:17px}
.cf p{margin:0;color:var(--tx2);font-size:13.5px;line-height:1.5}
.cf .dt{margin:14px 0 0;background:var(--hov);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:left;font-size:12.5px;color:var(--tx2);max-height:140px;overflow:auto}
.cf .dt div{display:flex;gap:8px;padding:2px 0}
.cf .dt span{color:var(--mu);min-width:92px;font-weight:600}
.cf .cfb{display:flex;gap:8px;margin-top:20px}
.cf .cfb .btn{flex:1}
.ed .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ed textarea{width:100%;min-height:min(52vh,460px);border:1px solid var(--bd);background:var(--hov);border-radius:14px;padding:14px 16px;outline:none;resize:vertical;line-height:1.6;font-size:14.5px;color:var(--tx)}
.ed textarea:focus{border-color:var(--p);background:var(--card);box-shadow:0 0 0 4px var(--pr)}
.ed .ei2{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--mu)}
.ed kbd{border:1px solid var(--bd2);border-radius:4px;padding:0 4px;font-family:inherit}
/* Filtros */
.fsec{margin-bottom:18px}
.fsec h4{margin:0 0 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);display:flex;justify-content:space-between;align-items:center;min-height:28px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ffld{display:flex;flex-direction:column;gap:5px}
.ffld label{font-size:12.5px;font-weight:600;color:var(--tx2)}
.fsel{display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;border:1px solid var(--bd);background:var(--hov);border-radius:var(--r2);padding:0 12px;cursor:pointer;text-align:left;width:100%}
.fsel:hover{border-color:var(--bd2);background:var(--card)}
.fsel:focus-visible{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--pr)}
.fsel.set{border-color:var(--p);background:var(--pl);color:var(--p);font-weight:600}
.fsel .fv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsel .fv.ph{color:var(--mu);font-weight:400}
.fsel .n{background:var(--p);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
.fsel svg{width:16px;height:16px;color:var(--mu)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.pre{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--tx2);cursor:pointer}
.pre:hover{border-color:var(--p);color:var(--p)}
.pre.on{background:var(--p);border-color:var(--p);color:#fff}
.fres{margin-right:auto;display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:13px}
.fres b{color:var(--p);font-size:15px}
/* Drawer */
.dw{position:fixed;inset:0;z-index:140;display:none}
.dw.show{display:block}
.dw .sh{position:absolute;inset:0;background:rgba(8,26,25,.38);backdrop-filter:blur(3px)}
.dw .pn{position:absolute;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--card);box-shadow:var(--sh3);display:flex;flex-direction:column;animation:slin .24s cubic-bezier(.2,.9,.3,1)}
@keyframes slin{from{transform:translateX(100%)}}
.dw header{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start}
.dw header h2{margin:0;font-size:17px}
.dw header p{margin:3px 0 0;color:var(--mu);font-size:13px}
.seg{display:flex;gap:4px;margin:0 20px;padding:4px;background:var(--hov);border:1px solid var(--bd);border-radius:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--p);box-shadow:var(--sh1),0 0 0 1px var(--bd)}
.dw .tools{display:flex;gap:8px;padding:14px 20px 10px}
.inp{height:38px;border:1px solid var(--bd);background:var(--hov);border-radius:var(--r2);padding:0 12px;outline:none;min-width:0;flex:1}
.inp:focus{border-color:var(--p);background:var(--card);box-shadow:0 0 0 4px var(--pr)}
#dwAdd{text-transform:uppercase}
.dw .list{flex:1;overflow:auto;padding:4px 14px 14px}
.li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px}
.li:hover{background:var(--hov)}
.li .av{width:32px;height:32px;border-radius:10px;background:var(--pl);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.li small{color:var(--mu);font-size:11.5px;white-space:nowrap}
.dw footer{padding:12px 20px;border-top:1px solid var(--bd);color:var(--mu);font-size:12px}
/* Import */
.steps{display:flex;gap:10px;margin-bottom:16px}
.stp{flex:1;display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--hov)}
.stp .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--bd);color:var(--tx2);flex-shrink:0}
.stp.on{border-color:var(--p);background:var(--pl)} .stp.on .n{background:var(--p);color:#fff}
.stp.ok .n{background:var(--ok);color:#fff}
.stp b{display:block;font-size:13px} .stp small{color:var(--mu);font-size:11.5px}
.tplc{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--bd);border-radius:14px;margin-bottom:12px}
.tplc .fi{width:46px;height:46px;border-radius:12px;background:#1d6f42;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.tplc div{flex:1;min-width:0} .tplc b{display:block;overflow:hidden;text-overflow:ellipsis} .tplc small{color:var(--mu)}
.drop{border:2px dashed var(--bd2);border-radius:16px;padding:30px 16px;text-align:center;color:var(--mu);cursor:pointer;background:var(--hov)}
.drop:hover,.drop.ov2{border-color:var(--p);background:var(--pl);color:var(--p)}
.drop .di{width:52px;height:52px;border-radius:16px;background:var(--card);color:var(--p);display:grid;place-items:center;margin:0 auto 10px;box-shadow:var(--sh2)}
.drop b{color:var(--tx);display:block;margin-bottom:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.kpi{border:1px solid var(--bd);border-radius:14px;padding:11px 13px}
.kpi b{display:block;font-size:22px;color:var(--p);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mu)}
.kpi.main{background:linear-gradient(135deg,var(--p),var(--p2));border:0} .kpi.main b,.kpi.main span{color:#fff}
.kpi.bad b{color:var(--dng)}
.pvw{overflow:auto;border:1px solid var(--bd);border-radius:12px}
.pv{width:100%;border-collapse:collapse;font-size:12px}
.pv th{position:static;padding:8px 10px;font-size:10.5px}
.pv td{padding:7px 10px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--bd)}
.note{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-top:10px;padding:9px 12px;border-radius:10px;background:#fff8e1;color:#6b4c00}
@media (prefers-color-scheme:dark){.note{background:#2f2710;color:#ffe08a}}
.run{margin-top:14px;border:1px solid var(--bd);border-radius:14px;padding:14px}
.run .rt{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.run .rt b{color:var(--p)}
.prog{height:8px;border-radius:8px;background:var(--bd);overflow:hidden;margin:10px 0 8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .25s}
.run .rs{font-size:12px;color:var(--mu);min-height:16px}
pre.sql{background:var(--hov);border:1px solid var(--bd);border-radius:12px;padding:12px;max-height:360px;overflow:auto;font-size:12px;white-space:pre}

/* Loading em tela inteira */
.ldov{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,26,25,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);cursor:progress}
.ldov.show{display:flex;animation:ldin .18s ease}
@keyframes ldin{from{opacity:0}}
.ldbox{display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:30px 42px;min-width:230px;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--sh3);animation:mi .2s cubic-bezier(.2,.9,.3,1.15)}
.ldbox b{font-size:15px;font-weight:700;color:var(--tx)}
.spin{width:56px;height:56px;border-radius:50%;border:5px solid var(--pl2);border-top-color:var(--p);border-right-color:var(--p2);animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:1.8s}}
/* Toast */
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:320}
.toast{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);padding:12px 16px 12px 12px;border-radius:13px;box-shadow:var(--sh3);animation:tin .25s cubic-bezier(.2,.9,.3,1.2);max-width:380px;overflow:hidden;font-size:13.5px}
.toast .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pl);color:var(--ok);flex-shrink:0}
.toast.err .ti{background:var(--dngl);color:var(--dng)}
.toast .ti svg{width:16px;height:16px}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}}
.toast.out{animation:tout .2s forwards}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}

@media (max-width:760px){
  .app{padding:10px;gap:10px}
  .brand h1{font-size:16px} .brand p{display:none}
  .search{flex:1 1 100%}
  .btn .tx{display:none} .btn{padding:0 11px}
  .sep,.sp{display:none}
  .steps{flex-direction:column}
  .pop.cb,.pop.dp{width:calc(100vw - 24px)!important;left:12px!important}
  .toasts{left:12px;right:12px} .toast{max-width:none}
}
</style>

async function api(path,opt={}){
  if(!navigator.onLine){const er=new Error('Sem conexão');er.net=true;throw er}
  const h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',...(opt.headers||{})};
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),opt.timeout||30000);

  try{r=await fetch(SB_URL+'/rest/v1/'+path,{method:opt.method||'GET',body:opt.body,headers:h,signal:ctl.signal,cache:'no-store'})}
  catch(e){clearTimeout(to);const er=new Error(e.name==='AbortError'?'Tempo de resposta excedido':'Falha de rede');er.net=true;throw er}
  clearTimeout(to);
  const txt=await r.text();let body=null;try{body=txt?JSON.parse(txt):null}catch(e){body=txt}
  if(!r.ok){const e=new Error((body&&(body.message||body.hint))||('HTTP '+r.status));e.status=r.status;e.code=body&&body.code;
    if(r.status>=500||r.status===429||r.status===408)e.net=true; throw e}
  return opt.raw?{body,headers:r.headers}:body;
}
/* ======================= LEITURA FIEL =======================
   Paginação por CHAVE (num/id) em vez de OFFSET: edições, inserções ou exclusões
   feitas durante a leitura não deslocam páginas (causa de linhas duplicadas/faltando).
   Funciona com qualquer limite "Max rows" do Supabase. */
const PG=1000;
async function keyset(t,sel,key,from,to){
  const out=[];let last=from;
  for(;;){
    let q=`${t}?${sel}&order=${key}.asc&limit=${PG}`;
    if(last!=null)q+=`&${key}=gt.${encodeURIComponent(last)}`;
    if(to!=null)q+=`&${key}=lte.${encodeURIComponent(to)}`;
    const b=await api(q,{timeout:60000})||[];
    if(!b.length)break;
    for(const r of b)out.push(r);
    last=b[b.length-1][key];
    if(to!=null&&last>=to)break;
  }
  return out;
}
async function fetchRegs(){
  try{
    const top=await api(`${T_REG}?select=num&order=num.desc&limit=1`,{raw:true,headers:{Prefer:'count=exact'}});
    const total=+((top.headers.get('content-range')||'').split('/')[1])||0;
    if(!total||!top.body||!top.body.length)return {rows:[],total:0};
    const max=+top.body[0].num;
    const lo=await api(`${T_REG}?select=num&order=num.asc&limit=1`);
    const min=+(lo&&lo[0]?lo[0].num:1);
    const W=PG,wins=[];for(let a=min-1;a<max;a+=W)wins.push([a,Math.min(a+W,max)]);
    const parts=new Array(wins.length);let nx=0;
    const worker=async()=>{while(nx<wins.length){const i=nx++;parts[i]=await keyset(T_REG,SEL,'num',wins[i][0],wins[i][1])}};
    await Promise.all(Array.from({length:Math.min(4,wins.length)},worker));
    return {rows:parts.flat(),total};
  }catch(e){
    if(e.code!=='42703'&&!/num/.test(e.message||''))throw e;
    const rows=await keyset(T_REG,SEL.replace('id,num,','id,'),'id',null,null);
    return {rows,total:rows.length};
  }
}

function localISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
async function fetchRecentRegs(){

function drain(){return dP||(dP=runQ().finally(()=>{dP=null}))}
async function runQ(){
  while(OUT.length){
    const job=OUT[0];job.busy=true;
    try{await job.run();OUT.shift();online=true}
    catch(e){
      job.busy=false;
      if(e.net){online=false;setSave();clearTimeout(retryT);retryT=setTimeout(drain,navigator.onLine?5000:15000);markPending();return}
      OUT.shift();toast('Erro ao sincronizar: '+e.message,true);
    }
    setSave();markPending();
  }
  online=true;setSave();markPending();
  if(!st.ok&&!loadP)load();
}
function patchJob(id,p){
  const ex=OUT.find(j=>j.t==='patch'&&j.id===id&&!j.busy);
  if(ex){Object.assign(ex.p,p);return}
  const job={t:'patch',id,p:{...p}};
  job.run=()=>api(`${T_REG}?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(job.p)});
  enqueue(job);
}
/* ID numérico (#) gerado pelo banco: exibido assim que a linha é sincronizada */
const numHTML=r=>r.num!=null?String(r.num):'<span class="np" title="ID será gerado ao sincronizar">…</span>';
function updNum(r){const td=document.querySelector(`#tb tr[data-id="${r.id}"] td.num`);if(td){td.innerHTML=numHTML(r);td.title=r.num!=null?'ID '+r.num:''}}
const insertJob=row=>{const payload={id:row.id};FIELDS.forEach(k=>payload[k]=row[k]??null);
  enqueue({t:'ins',id:row.id,run:async()=>{
    const b=await api(`${T_REG}?on_conflict=id&select=id,num`,{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=representation'},body:JSON.stringify([payload])});
    let got=b&&b[0];
    if(!got||got.num==null){const g=await api(`${T_REG}?id=eq.${row.id}&select=id,num`);got=g&&g[0]} // reenvio após timeout: busca o ID já gerado
    if(got&&got.num!=null){row.num=got.num;delete row._k;invCopy();updNum(row);markPending()}
  }})};
const deleteJob=id=>{
  for(let i=OUT.length-1;i>=0;i--)if(OUT[i].id===id&&!OUT[i].busy&&(OUT[i].t==='patch'||OUT[i].t==='ins')){const wasIns=OUT[i].t==='ins';OUT.splice(i,1);if(wasIns){setSave();return}}
  enqueue({t:'del',id,run:()=>api(`${T_REG}?id=eq.${id}`,{method:'DELETE'})});
};
const pendIds=()=>{const s=new Set(OUT.map(j=>j.id).filter(Boolean));Object.keys(pend).forEach(k=>s.add(k));return s};
/* ======================= CÓPIAS IDÊNTICAS =======================
   Linha com conteúdo idêntico a outra é marcada como CÓPIA na coluna #.
   Original = menor ID (#). O ícone some assim que qualquer campo for alterado. */
let COPY=null;const invCopy=()=>{COPY=null};
const CP_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const hasBody=r=>['mina','categoria','setores','preventivas','falhas','dia_atual','impacto'].some(k=>String(r[k]??'').trim()!=='');
const sigOf=r=>FIELDS.map(k=>k==='data'?String(r.data||'').slice(0,10):String(r[k]??'').trim()).join('\u241F');
const ordKey=r=>[r.num!=null?+r.num:Infinity,r.created_at||'',r.id];
const older=(a,b)=>{const x=ordKey(a),y=ordKey(b);for(let i=0;i<3;i++){if(x[i]<y[i])return true;if(x[i]>y[i])return false}return false};
function copies(){
  if(COPY)return COPY;
  const first=new Map();
  for(const r of st.rows){if(!hasBody(r))continue;const k=sigOf(r),o=first.get(k);if(!o||older(r,o))first.set(k,r)}
  COPY=new Map();
  for(const r of st.rows){if(!hasBody(r))continue;const o=first.get(sigOf(r));if(o&&o!==r)COPY.set(r.id,o)}
  return COPY;
}
function markCopies(){
  const cp=copies();
  document.querySelectorAll('#tb tr[data-id]').forEach(tr=>{
    const n=tr.firstElementChild;if(!n)return;const o=cp.get(tr.dataset.id),cur=n.querySelector('.cpi');
    tr.classList.toggle('cpy',!!o);
    if(!o){cur&&cur.remove();return}
    const tip=`Cópia de ${o.num!=null?'#'+o.num:'linha ainda não sincronizada'} — conteúdo idêntico ao original. O ícone some ao alterar algum campo.`;
    if(!cur)n.insertAdjacentHTML('beforeend',`<span class="cpi" title="${esc(tip)}" aria-label="${esc(tip)}">${CP_ICON}</span>`);
    else if(cur.title!==tip){cur.title=tip;cur.setAttribute('aria-label',tip)}
  });
}
function markPending(){
  markCopies();
  const s=pendIds();
  document.querySelectorAll('#tb tr[data-id]').forEach(tr=>{
    const n=tr.firstElementChild;if(!n)return;const has=s.has(tr.dataset.id),cur=n.querySelector('.pd');
    if(has&&!cur)n.insertAdjacentHTML('beforeend',`<i class="dot ${online?'busy':'err'} pd" title="Aguardando sincronização"></i>`);
    else if(!has&&cur)cur.remove();else if(cur)cur.className=`dot ${online?'busy':'err'} pd`;
  });
}

const SEL='select=id,num,'+FIELDS.join(',')+',created_at';
const GONE=new Set();
let loadP=null,nextP=null,loadSeq=0;
function load(){
  if(loadP){if(!nextP)nextP=loadP.then(()=>{nextP=null;return load()});return nextP}
  const seq=++loadSeq;
  loadP=doLoad(seq).finally(()=>{loadP=null});return loadP;
}
function applyServer(res,lst,ts,isFull){
  const srv=dedupe(res.rows),patches={},dels=new Set(GONE);
  OUT.forEach(j=>{if(j.t==='patch')patches[j.id]=Object.assign(patches[j.id]||{},j.p);if(j.t==='del')dels.add(j.id)});
  for(const id in pend)patches[id]=Object.assign(patches[id]||{},pend[id]);
  const pids=pendIds(),byId=new Map(st.rows.map(r=>[r.id,r])),out=[];
  srv.forEach((r,id)=>{
    if(dels.has(id))return;fixRow(r);if(patches[id])Object.assign(r,patches[id]);
    const loc=byId.get(id);if(loc&&loc._dirty)for(const k in loc._dirty)if(loc._dirty[k]>=ts)r[k]=loc[k];
    out.push(r);
  });
  st.rows.forEach(r=>{if(!srv.has(r.id)&&!dels.has(r.id)&&(pids.has(r.id)||(r._born||0)>=ts))out.push(r)});
  out.sort(byDefault);st.rows=out;invCopy();
  if(lst){LISTS.forEach(c=>st.lst[c.k]=[]);lst.forEach(o=>{const v=UP(o.valor);if(st.lst[o.campo]&&v&&!st.lst[o.campo].includes(v))st.lst[o.campo].push(v)})}
  st.srvTotal=isFull?res.total:Math.max(st.srvTotal||0,srv.size);st.srvRead=srv.size;
  st.ok=true;online=true;$('#banner').className='banner';inval();setSave();renderAll();
}
async function doLoad(seq){
  if(st.loading)render();conn('busy','Carregando últimos 7 dias...');
  const t0=performance.now(),ts=Date.now();loadShow('Carregando últimos 7 dias...');
  try{
    const [recent,lst]=await Promise.all([fetchRecentRegs(),keyset(T_LST,'select=id,campo,valor','id',null,null)]);
    if(seq!==loadSeq)return;
    /* IMPORTANTE: libera o estado de loading ANTES de renderizar.
       Antes, applyServer() chamava renderAll() com st.loading=true e a tabela
       continuava mostrando o esqueleto até o histórico completo terminar. */
    st.loading=false;
    applyServer(recent,lst,ts,false);
    perf.load=Math.round(performance.now()-t0);
    loadHide();

    /* Garante que os últimos 7 dias sejam pintados na tabela antes da carga histórica. */
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    if(seq!==loadSeq)return;
    conn('on',`Últimos 7 dias carregados · ${recent.rows.length} registro(s)`);

    /* O restante só começa quando o navegador estiver livre, sem modal e sem bloquear a tabela. */
    const startHistory=()=>{if(seq===loadSeq){conn('busy','Carregando histórico em segundo plano...');void loadHistory(seq,lst,ts)}};
    if('requestIdleCallback' in window)requestIdleCallback(startHistory,{timeout:1800});
    else setTimeout(startHistory,1200);
  }catch(e){
    loadHide();st.loading=false;st.ok=false;
    if(e.net){online=false;clearTimeout(retryT);retryT=setTimeout(drain,10000)}
    else{conn('err','Erro');$('#bSqlB').style.display='';$('#bRetry').style.display='';$('#bannerTx').textContent=(e.code==='42P01'||e.code==='PGRST205'||e.status===404)?'As tabelas "registro_operacional" e "registro_listas" não existem no Supabase. Execute o SQL de criação e clique em Tentar novamente.':'Falha ao carregar do Supabase: '+e.message;$('#banner').className='banner show'}
    inval();setSave();renderAll();
  }
}
async function loadHistory(seq,lst,ts){
  try{
    let res=await fetchRegs();if(seq!==loadSeq)return;
    let srv=dedupe(res.rows);
    if(srv.size!==res.total){res=await fetchRegs();if(seq!==loadSeq)return;srv=dedupe(res.rows)}
    applyServer(res,lst,ts,true);perf.load=Math.round(performance.now()-ts);
    if(srv.size!==res.total)toast(`Atenção: lidas ${srv.size} de ${res.total} linhas do banco. Clique em Atualizar.`,true);
    else toast(`Base completa carregada: ${srv.size} registro(s).`);
  }catch(e){
    if(seq!==loadSeq)return;
    if(e.net){online=false;setSave();toast('Os últimos 7 dias foram carregados. O histórico continuará quando houver conexão.',true)}
    else toast('Não foi possível completar o histórico: '+e.message,true);
  }
}

let OPTC={};const inval=()=>{OPTC={}};
function opts(k){
  if(OPTC[k])return OPTC[k];
  const m=new Map();
  st.lst[k].forEach(v=>{v=UP(v);v&&m.set(v,v)});
  st.rows.forEach(r=>{const v=r[k];if(v&&!m.has(v))m.set(v,v)});
  return OPTC[k]=[...m.values()].sort(cmp);
}
const usage=(k,v)=>{let n=0;for(const r of st.rows)if(r[k]===v)n++;return n};
const countsOf=k=>{const m=new Map();for(const r of st.rows){const v=r[k];if(v)m.set(v,(m.get(v)||0)+1)}return m};
function lstAddJob(items){enqueue({t:'lst',run:()=>api(`${T_LST}?on_conflict=campo,valor`,{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(items)})})}
function addOpt(k,v){
  v=UP(v);if(!v||st.lst[k].includes(v))return;
  st.lst[k].push(v);inval();lstAddJob([{campo:k,valor:v}]);
}
function addOptsBulk(map){
  const p=[];for(const k in map)map[k].forEach(v=>{v=UP(v);if(v&&!st.lst[k].includes(v)){st.lst[k].push(v);p.push({campo:k,valor:v})}});
  inval();if(p.length)lstAddJob(p);
}
function delOpt(k,v){
  st.lst[k]=st.lst[k].filter(o=>o!==v);inval();
  enqueue({t:'lst',run:()=>api(`${T_LST}?campo=eq.${encodeURIComponent(k)}&valor=eq.${encodeURIComponent(v)}`,{method:'DELETE'})});
}
async function removeListItem(k,v){
  const col=COLS.find(c=>c.k===k),n=usage(k,v);
  const ok=await confirmDel({title:`Excluir “${v}”?`,
    msg:n?`Este item está em uso em ${n} registro(s). Ele será removido da lista e o campo ${col.t} será limpo nesses registros.`:`O item será removido da lista ${col.t}.`,ok:'Excluir item'});
  if(!ok)return false;
  delOpt(k,v);

    invCopy();st.rows.forEach(r=>{if(r[k]===v){r[k]=null;delete r._k;(r._dirty||(r._dirty={}))[k]=Date.now()}});
    enqueue({t:'bulk',run:()=>api(`${T_REG}?${k}=eq.${encodeURIComponent(v)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({[k]:null})})});
  }

/* ---- edição com debounce → fila ---- */
function queue(r,k,v,now){
  if((r[k]??'')===v)return;r[k]=v===''?null:v;delete r._k;(r._dirty||(r._dirty={}))[k]=Date.now();invCopy();if(LK.includes(k))inval();
  (pend[r.id]=pend[r.id]||{})[k]=v===''?null:v;
  clearTimeout(timers[r.id]);timers[r.id]=setTimeout(()=>flush(r.id),now?0:700);setSave();markPending();
}
function flush(id){const p=pend[id];if(!p)return;delete pend[id];clearTimeout(timers[id]);patchJob(id,p)}
function flushAll(){Object.keys(pend).forEach(flush)}

function rowKey(x){return x._k||(x._k=norm((x.num!=null?'#'+x.num+' ':'')+COLS.map(c=>c.type==='date'?fmtD(x[c.k]):x[c.k]).join(' ')))}
const inTab=x=>view.tab==='__all'||(view.tab==='__none'?!x.lancamento:x.lancamento===view.tab);
function match(x,d,act,q){
  if(!inTab(x))return false;
  const dt=(x.data||'').slice(0,10);
  if(d.de&&(!dt||dt<d.de))return false;if(d.ate&&(!dt||dt>d.ate))return false;
  for(const [k,s] of act)if(!s.has(x[k]))return false;
  return !q||rowKey(x).includes(q);
}
const actOf=d=>FL.filter(c=>d.f[c.k]&&d.f[c.k].length).map(c=>[c.k,new Set(d.f[c.k])]);
function filtered(){
  const q=norm(view.q),act=actOf(view);
  let r=st.rows.filter(x=>match(x,view,act,q));
  const s=view.sort;
  if(s.k){const sv=x=>s.k==='cls'?[x.mina,x.categoria,x.setores,x.lancamento].map(v=>v||'').join('|'):(s.k==='num'?(x.num!=null?String(x.num).padStart(12,'0'):'~'):(x[s.k]||''));r=r.slice().sort((a,b)=>cmp(sv(a),sv(b))*s.dir)}
  return r;
}
function countDraft(d){const q=norm(view.q),act=actOf(d);let n=0;for(const x of st.rows)if(match(x,d,act,q))n++;return n}
const nAct=v=>(v.de||v.ate?1:0)+FL.filter(c=>v.f[c.k].length).length;

function presetRange(p){
  const t=new Date(),d0=new Date(t);
  if(p==='hoje')return [iso(t),iso(t)];
  if(p==='ontem'){d0.setDate(t.getDate()-1);return [iso(d0),iso(d0)]}
  if(p==='7'){d0.setDate(t.getDate()-6);return [iso(d0),iso(t)]}
  if(p==='30'){d0.setDate(t.getDate()-29);return [iso(d0),iso(t)]}
  if(p==='mes')return [iso(new Date(t.getFullYear(),t.getMonth(),1)),iso(t)];
  if(p==='mesant')return [iso(new Date(t.getFullYear(),t.getMonth()-1,1)),iso(new Date(t.getFullYear(),t.getMonth(),0))];
  return ['',''];
}

        else if(t==='inlineStr')val=tags(c,'t').map(x=>x.textContent).join('');
        else if(v){const n=v.textContent;val=t==='str'||t==='e'||t==='b'||isNaN(+n)?n:+n}
        arr[col]=val;
      });
    });
    for(let i=0;i<aoa.length;i++)if(!aoa[i])aoa[i]=[];
    sheets.push({name:s.getAttribute('name'),aoa});
  }
  return sheets;
}
function parseCSV(text){
  text=text.replace(/^\ufeff/,'');const f=text.split(/\r?\n/)[0]||'';
  const sep=(f.match(/;/g)||[]).length>=(f.match(/,/g)||[]).length?';':',';
  const out=[];let row=[],v='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){v+='"';i++}else q=false}else v+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(v);v=''}
    else if(ch==='\n'){row.push(v.replace(/\r$/,''));out.push(row);row=[];v=''}else v+=ch}
  if(v!==''||row.length){row.push(v.replace(/\r$/,''));out.push(row)}
  return out;
}
function toISO(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&v>0&&v<200000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?`${m[1]}-${pad(m[2])}-${pad(m[3])}`:null;
}

}

$('#fImp').addEventListener('change',e=>{const f=e.target.files[0];if(f)readFile(f);e.target.value=''});
async function readFile(file){return withLoad('Lendo arquivo...',()=>readFile0(file))}
async function readFile0(file){
  const pv=$('#impPv');if(pv)pv.innerHTML='<div class="note" style="background:var(--pl);color:var(--p)">Lendo arquivo...</div>';
  try{
    let sheets;
    if(/\.csv$/i.test(file.name))sheets=[{name:'CSV',aoa:parseCSV(await file.text())}];
    else if(/\.xlsx$/i.test(file.name))sheets=await readXlsx(await file.arrayBuffer());
    else throw new Error('Use arquivos .xlsx ou .csv');
    const out=[],warn=[];let bad=0;
    sheets.filter(s=>!['LISTAS','INSTRUCOES'].includes(norm(s.name))).forEach(s=>{
      const a=s.aoa;if(!a.length)return;
      const hi=a.findIndex(r=>r.some(x=>norm(x)==='DATA'||norm(x)==='LANCAMENTO'));
      if(hi<0){warn.push(`Aba “${s.name}” ignorada (títulos não reconhecidos).`);return}
      const hdr=a[hi].map(norm),map=COLS.map(c=>hdr.indexOf(norm(c.t)));
      const miss=COLS.filter((c,i)=>map[i]<0).map(c=>c.t);if(miss.length)warn.push(`Aba “${s.name}”: colunas não encontradas – ${miss.join(', ')}.`);
      const tabName=['REGISTROS','CSV'].includes(norm(s.name))?'':UP(s.name);
      for(let li=hi+1;li<a.length;li++){
        const line=a[li];if(!line||!line.some(x=>String(x??'').trim()!==''))continue;
        const r={id:uuid()};
        COLS.forEach((c,i)=>{const v=map[i]>=0?line[map[i]]:'';
          if(c.type==='date'){r[c.k]=toISO(v);if(v!==''&&v!=null&&!r[c.k])bad++}
          else if(c.type==='list')r[c.k]=UP(v)||null;
          else r[c.k]=String(v??'').trim()||null});
        if(!r.lancamento&&tabName)r.lancamento=tabName;
        out.push(r);
      }
    });
    impRows=out;impName=file.name;showPreview(warn,bad);
  }catch(err){if(pv)pv.innerHTML='';toast('Erro ao ler arquivo: '+err.message,true)}
}
function showPreview(warn,bad){
  const pv=$('#impPv');if(!pv)return;
  const g={};impRows.forEach(r=>{const k=r.lancamento||'Sem lançamento';g[k]=(g[k]||0)+1});
  const sd=impRows.filter(r=>!r.data).length;
  $('#stpW').innerHTML=stepsHTML(impRows.length?3:2);
  pv.innerHTML=`<div class="tplc" style="margin:12px 0 0"><span class="fi" style="background:var(--p)">✓</span><div><b>${esc(impName)}</b><small>Arquivo lido com sucesso</small></div><button type="button" class="btn sm" id="impOther">Trocar arquivo</button></div>
    <div class="kpis"><div class="kpi main"><b>${impRows.length.toLocaleString('pt-BR')}</b><span>linhas para importar</span></div>${Object.keys(g).sort(cmp).slice(0,7).map(k=>`<div class="kpi"><b>${g[k]}</b><span>${esc(k)}</span></div>`).join('')}</div>
    ${impRows.length?`<div class="pvw"><table class="pv"><thead><tr>${COLS.map(c=>`<th>${esc(c.t)}</th>`).join('')}</tr></thead><tbody>${impRows.slice(0,5).map(r=>`<tr>${COLS.map(c=>`<td title="${esc(r[c.k])}">${esc(c.type==='date'?fmtD(r[c.k]):r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}
    ${bad?`<div class="note">⚠ ${bad} data(s) em formato inválido serão importadas em branco.</div>`:sd?`<div class="note">⚠ ${sd} linha(s) sem DATA serão importadas sem data.</div>`:''}
    ${!impRows.length?'<div class="note">⚠ Nenhuma linha preenchida foi encontrada.</div>':''}
    ${warn.map(w=>`<div class="note">⚠ ${esc(w)}</div>`).join('')}`;
  $('#impPick').style.display='none';
  $('#impOther').addEventListener('click',()=>{impRows=[];pv.innerHTML='';$('#impPick').style.display='';$('#stpW').innerHTML=stepsHTML(2);setImpBtn()});
  setImpBtn();
}
function setImpBtn(){const b=$('#bDoImp');if(!b)return;b.disabled=!impRows.length;b.className='btn pri';b.textContent=impRows.length?`Importar ${impRows.length.toLocaleString('pt-BR')} linha(s)`:'Importar'}

/* Envio robusto: lotes de 250, 3 em paralelo, retentativa automática, espera o sinal voltar,
   ids gerados no navegador (reenvio nunca duplica), isolamento de linhas com erro */
const CHUNK=250,WORKERS=3;
const waitOnline=()=>navigator.onLine?Promise.resolve():new Promise(r=>addEventListener('online',r,{once:true}));
async function sendChunk(rows){
  let attempt=0;
  for(;;){
    if(job.cancel)return;
    if(!navigator.onLine){job.status='Sem conexão – a importação continuará automaticamente quando o sinal voltar...';updRun();await waitOnline()}
    try{
      await api(`${T_REG}?on_conflict=id`,{method:'POST',timeout:90000,headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(rows)});
      job.ok+=rows.length;job.status='';updRun();return;
    }catch(e){
      if(e.net){
        attempt++;job.retries++;const w=Math.min(20000,1000*2**Math.min(attempt,5));
        job.status=`${e.message}. Nova tentativa em ${Math.round(w/1000)}s (tentativa ${attempt})...`;updRun();await sleep(w);continue;
      }
      if(rows.length===1){job.fail.push({...rows[0],_erro:e.message});updRun();return}
      const m=Math.ceil(rows.length/2);await sendChunk(rows.slice(0,m));await sendChunk(rows.slice(m));return;
    }
  }
}
function updRun(){
  const el=$('#impRun');if(!el||!job)return;
  const pct=Math.round((job.ok+job.fail.length)/job.total*100);
  const sec=(performance.now()-job.t0)/1000,rate=job.ok/Math.max(sec,.1);
  el.innerHTML=`<div class="run"><div class="rt"><span><b>${job.ok.toLocaleString('pt-BR')}</b> de ${job.total.toLocaleString('pt-BR')} gravadas${job.fail.length?` · <span style="color:var(--dng)">${job.fail.length} com erro</span>`:''}${job.retries?` · ${job.retries} retentativa(s)`:''}</span><span>${pct}% · ${Math.round(rate)} linhas/s</span></div>
    <div class="prog"><i style="width:${pct}%"></i></div><div class="rs">${esc(job.status||(job.cancel?'Cancelando após os lotes em andamento...':'Enviando lotes ao Supabase...'))}</div></div>`;
}
async function doImport(){
  if(!impRows.length||job)return;
  importing=true;job={total:impRows.length,ok:0,fail:[],retries:0,cancel:false,status:'',t0:performance.now()};
  const chunks=[];for(let i=0;i<impRows.length;i+=CHUNK)chunks.push(impRows.slice(i,i+CHUNK));
  $('#impX').style.visibility='hidden';$('#impCancel').style.display='none';$('#impOther')&&($('#impOther').style.display='none');
  const b=$('#bDoImp');b.className='btn';b.textContent='Cancelar importação';
  conn('busy','Importando...');updRun();
  let next=0;
  const worker=async()=>{while(next<chunks.length&&!job.cancel){const c=chunks[next++];await sendChunk(c)}};
  await Promise.all(Array.from({length:Math.min(WORKERS,chunks.length)},worker));
  const m={};LISTS.forEach(c=>m[c.k]=[...new Set(impRows.map(r=>r[c.k]).filter(Boolean))]);
  job.status='Atualizando listas e recarregando dados...';updRun();
  addOptsBulk(m);flushAll();await drain();
  const res=job;job=null;importing=false;
  await load();
  showResult(res);
}
function showResult(res){
  const el=$('#impRun');if(!el)return;
  const sec=Math.round((performance.now()-res.t0)/100)/10,pn=res.total-res.ok-res.fail.length;
  $('#stpW').innerHTML=stepsHTML(4);
  el.innerHTML=`<div class="kpis"><div class="kpi main"><b>${res.ok.toLocaleString('pt-BR')}</b><span>linhas gravadas</span></div>
    <div class="kpi ${res.fail.length?'bad':''}"><b>${res.fail.length}</b><span>com erro</span></div>
    ${pn?`<div class="kpi bad"><b>${pn}</b><span>não enviadas (cancelado)</span></div>`:''}
    <div class="kpi"><b>${sec}s</b><span>tempo total</span></div></div>
    ${res.fail.length?`<div class="note">⚠ ${res.fail.length} linha(s) foram recusadas pelo banco. Baixe, corrija e importe novamente.<button type="button" class="btn sm" id="dlErr" style="margin-left:auto">${I.dl}Baixar linhas com erro</button></div>`:''}`;
  $('#impX').style.visibility='';impRows=[];
  const b=$('#bDoImp'),nb=b.cloneNode(false);nb.className='btn pri';nb.textContent='Concluir';nb.disabled=false;b.replaceWith(nb);
  nb.addEventListener('click',()=>closeModal(true));
  if(res.fail.length)$('#dlErr').addEventListener('click',()=>{
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const csv=[[...COLS.map(c=>c.t),'ERRO'].map(q).join(';')].concat(res.fail.map(r=>[...COLS.map(c=>c.type==='date'?fmtD(r[c.k]):r[c.k]),r._erro].map(q).join(';'))).join('\r\n');
    download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`Importacao_erros_${stamp()}.csv`);
  });
  toast(res.fail.length?`${res.ok} gravadas, ${res.fail.length} com erro`:`${res.ok} linha(s) importada(s) com sucesso`,!!res.fail.length);
}

/* ======================= DICA (tooltip) da coluna Classificação ======================= */
const hintEl=$('#hint');let hintT=null,hintB=null;
function showHint(b){
  const k=b.dataset.hk,v=b.dataset.hv;
  hintEl.innerHTML=`<small>${esc(capT(k))}</small>${v?`<b>${esc(v)}</b>`:'<i>Não selecionado</i>'}`;
  hintEl.classList.add('show');
  const r=b.getBoundingClientRect(),w=hintEl.offsetWidth,h=hintEl.offsetHeight;
  hintEl.style.left=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8))+'px';
  hintEl.style.top=(r.top-h-8>8?r.top-h-8:r.bottom+8)+'px';
}
function hideHint(){clearTimeout(hintT);hintB=null;hintEl.classList.remove('show')}
$('#tb').addEventListener('mouseover',e=>{
  const b=e.target.closest('.cell[data-hk]');if(b===hintB)return;
  hideHint();if(!b||POP)return;hintB=b;hintT=setTimeout(()=>{if(hintB===b&&document.body.contains(b))showHint(b)},250);
});
$('#tb').addEventListener('mouseleave',hideHint);
$('#tb').addEventListener('mousedown',hideHint);
$('#wrap').addEventListener('scroll',hideHint,{passive:true});
$('#tb').addEventListener('focusin',e=>{const b=e.target.closest('.cell[data-hk]');if(b&&e.target.matches(':focus-visible')){hintB=b;showHint(b)}});
$('#tb').addEventListener('focusout',hideHint);
